<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#10052E" />
    <title>DOOM | دوم</title>
    <style>
      :root { color-scheme: dark; }
      html { overflow-x: clip; }
      body {
        margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px;
        background: #10052E radial-gradient(900px 480px at 85% -10%, rgba(8,123,255,.22), transparent 60%);
        color: #FFFFFF; text-align: center;
        font-family: system-ui, -apple-system, 'Segoe UI', Tahoma, 'Noto Sans Arabic', sans-serif;
      }
      img { max-width: 100%; height: auto; }
      h1 { font-size: 22px; margin: 28px 0 8px; }
      p { color: #C9C5DE; margin: 6px 0; }
      button {
        margin-top: 24px; min-height: 44px; padding: 0 22px; border: 0; border-radius: 12px; font: inherit; font-weight: 700;
        color: #10052E; background: linear-gradient(135deg, #087BFF, #00D9FF); cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/brand/doom-logo-horizontal-transparent-320.webp" width="240" height="89" alt="DOOM | دوم" />
      <h1>أنت غير متصل بالإنترنت</h1>
      <p lang="en" dir="ltr">You are offline.</p>
      <p lang="fr" dir="ltr">Vous êtes hors ligne.</p>
      <button type="button" onclick="location.reload()">إعادة المحاولة · Retry · Réessayer</button>
    </main>
  </body>
</html>
