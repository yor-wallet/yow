<title>YOR WALLET</title>
<style>
:root{

:root[data-theme="light"]{

*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font-family:var(--font);height:100%;min-height:100dvh;width:100%;overflow:hidden;-webkit-font-smoothing:antialiased;overscroll-behavior:none}

.topbar{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3);padding:calc(env(safe-area-inset-top,0px) + var(--sp-3)) var(--sp-5) var(--sp-3);min-height:60px;position:sticky;top:0;z-index:var(--z-sticky);background:linear-gradient(to bottom,color-mix(in srgb,var(--bg) 88%,transparent),transparent);backdrop-filter:blur(var(--blur-sm));-webkit-backdrop-filter:blur(var(--blur-sm))}

.topbar-back:active,.topbar-action:active{transform:scale(.9);background:var(--accent-soft)}
.topbar-action{color:var(--accent)}

.display{font-size:clamp(32px,8vw,40px);font-weight:700;letter-spacing:-.03em;line-height:1.08}
.h1{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.h2{font-size:20px;font-weight:600;letter-spacing:-.015em;line-height:1.25}
.body{font-size:15px;font-weight:400;color:var(--text-2);line-height:1.55}

.text-accent{color:var(--accent)}.text-success{color:var(--success)}.text-danger{color:var(--danger)}.text-warning{color:var(--warning)}.text-info{color:var(--info)}
.glass-subtle{background:var(--glass-1);backdrop-filter:blur(var(--blur-sm)) saturate(160%);-webkit-backdrop-filter:blur(var(--blur-sm)) saturate(160%);border:1px solid var(--border);border-radius:var(--r-md)}
.glass{background:var(--glass-2);backdrop-filter:blur(var(--blur-md)) saturate(180%);-webkit-backdrop-filter:blur(var(--blur-md)) saturate(180%);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:inset 0 1px 0 var(--glass-hl),0 8px 24px rgba(0,0,0,.24)}

.glass,.glass-elevated,.select-item,.item,.contact-card,.country-row,.service-pill{animation:elementReveal 420ms cubic-bezier(.2,1,.4,1) both}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 var(--sp-5);border-radius:var(--r-md);font-size:15px;font-weight:600;letter-spacing:-.005em;user-select:none;position:relative;overflow:hidden;transition:transform var(--t-fast) var(--ease),background var(--t-fast),opacity var(--t-fast),box-shadow var(--t-normal);width:100%}
.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{opacity:.4;pointer-events:none}
.btn svg{width:18px;height:18px;flex-shrink:0}
.btn-primary{background:linear-gradient(180deg,var(--accent),var(--accent-600));color:#fff;box-shadow:0 6px 20px var(--accent-glow),inset 0 1px 0 rgba(255,255,255,.28)}
.btn-secondary{background:var(--glass-1);backdrop-filter:blur(var(--blur-sm));-webkit-backdrop-filter:blur(var(--blur-sm));border:1px solid var(--border-2);color:var(--text)}

.btn-sm{min-height:40px;padding:0 var(--sp-4);font-size:13.5px;width:auto;border-radius:12px}
.field{display:flex;flex-direction:column;gap:var(--sp-2)}
.field-label{font-size:12.5px;font-weight:600;color:var(--text-2);letter-spacing:.01em}
.field-box{display:flex;align-items:center;gap:10px;min-height:54px;padding:0 var(--sp-4);background:var(--glass-1);backdrop-filter:blur(var(--blur-sm));-webkit-backdrop-filter:blur(var(--blur-sm));border:1.5px solid var(--border);border-radius:var(--r-md);transition:border-color var(--t-fast),box-shadow var(--t-normal),background var(--t-fast)}
.field-box:focus-within{border-color:var(--accent);background:var(--glass-2);box-shadow:0 0 0 4px var(--accent-soft),0 0 24px var(--accent-glow)}

.item{display:flex;align-items:center;gap:var(--sp-3);padding:14px var(--sp-4);border-bottom:1px solid var(--border);width:100%;transition:background var(--t-fast),transform var(--t-fast);text-align:start;color:inherit;cursor:pointer;background:none;border-left:none;border-right:none;border-top:none}

.item-title{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.bottom-nav{position:absolute;bottom:0;left:0;right:0;z-index:var(--z-nav);height:calc(72px + var(--safe-b));padding:0 var(--sp-4) var(--safe-b);display:flex;justify-content:space-around;align-items:stretch;background:var(--glass-2);backdrop-filter:blur(var(--blur-lg)) saturate(200%);-webkit-backdrop-filter:blur(var(--blur-lg)) saturate(200%);border-top:1px solid var(--border)}

.select-list{display:flex;flex-direction:column;gap:var(--sp-2)}

<!-- FIRESTORE SECURITY RULES — deploy these to Firebase.          -->
<!-- They enforce per-user isolation server-side.                  -->
<!-- ============================================================= -->
<script type="text/plain" id="firestore-rules-ref">
rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {

    function isSignedIn() { return request.auth != null; }
    function uid() { return request.auth.uid; }
    function isOwner(u) { return isSignedIn() && uid() == u; }
    function isAdmin() {
      return isSignedIn() &&
        (exists(/databases/$(database)/documents/users/$(uid()))
          && get(/databases/$(database)/documents/users/$(uid())).data.role == 'admin');
    }
    function isYorIdOwner(yorId) {
      return isSignedIn() &&
        exists(/databases/$(database)/documents/yorIds/$(yorId)) &&
        get(/databases/$(database)/documents/yorIds/$(yorId)).data.uid == uid();
    }

    // Public mapping: YOR-ID -> uid (read-only from client, write via server).
    match /yorIds/{yorId} {
      allow read: if isSignedIn();
      allow write: if false;
    }

    // User root + all subcollections. Only the owner (or admin) may touch them.
    match /users/{u} {
      allow read: if isOwner(u) || isAdmin();
      allow update: if (isOwner(u) || isAdmin())
        && !request.resource.data.diff(resource.data).affectedKeys().hasAny(['role','yorId','userId','firebaseUid']);
      allow create: if isOwner(u);
      allow delete: if false;

      match /{sub=**} {
        allow read: if isOwner(u) || isAdmin();
        allow write: if (isOwner(u) || isAdmin())
          && !(request.resource.data.keys().hasAny(['balance']) &&
               request.resource.data.balance != (resource == null ? 0 : resource.data.balance));
      }
    }

    // Transaction ledger — immutable once written. Server (Cloud Functions) is
    // the only writer capable of touching balances via Admin SDK.
    match /transactions/{txId} {
      allow read: if isSignedIn() &&
        (resource.data.senderUid == uid() || resource.data.receiverUid == uid() || isAdmin());
      allow write: if false;
    }

    // Mail queue — client enqueues, server dispatches.
    match /mail/{mailId} {
      allow read: if false;
      allow create: if isSignedIn()
        && request.resource.data.fromUid == uid()
        && request.resource.data.to is list;
      allow update, delete: if false;
    }

    // Audit log — write only by server.
    match /audit/{auditId} {
      allow read: if isAdmin();
      allow write: if false;
    }

    match /{document=**} {
      allow read, write: if false;
    }
  }
}
</script>

<!-- CLOUD FUNCTIONS REFERENCE — deploy to Firebase Functions.     -->
<!-- Server-side authority for financial operations.               -->
<!-- ============================================================= -->
<script type="text/plain" id="cloud-functions-ref">
// functions/index.js
const functions = require('firebase-functions');
const admin = require('firebase-admin');
admin.initializeApp();
const db = admin.firestore();

const CONFIRM_CODE = '050069'; // admin-only bootstrap code, rotate via Secret Manager

// Utility: verify admin role from Firestore (never trust claims only).
async function assertAdmin(uid) {
  const snap = await db.doc('users/' + uid).get();
  if (!snap.exists || snap.data().role !== 'admin') {
    throw new functions.https.HttpsError('permission-denied', 'admin only');
  }
}

// Bootstrap: generate unique YOR ID.
async function issueYorId() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  for (let i = 0; i < 20; i++) {
    let s = 'YOR-';
    for (let j = 0; j < 6; j++) s += chars[Math.floor(Math.random() * chars.length)];
    const ref = db.doc('yorIds/' + s);
    const existing = await ref.get();
    if (!existing.exists) return s;
  }
  throw new Error('yor-id-exhausted');
}

// On user creation: seed profile, accounts, wallets, welcome email.
exports.onUserCreated = functions.auth.user().onCreate(async (user) => {
  const yorId = await issueYorId();
  const uid = user.uid;
  const now = admin.firestore.FieldValue.serverTimestamp();
  const batch = db.batch();

  batch.set(db.doc('yorIds/' + yorId), { uid, createdAt: now });
  batch.set(db.doc('users/' + uid), {

// Server-side atomic transfer (user -> user, and admin -> user).
exports.transferFiat = functions.https.onCall(async (data, ctx) => {
  if (!ctx.auth) throw new functions.https.HttpsError('unauthenticated', 'auth required');
  const senderUid = ctx.auth.uid;
  const { toYorId, amount, currency, idempotencyKey } = data;

  if (typeof amount !== 'number' || !(amount > 0)) {
    throw new functions.https.HttpsError('invalid-argument', 'amount');
  }
  if (!toYorId || typeof toYorId !== 'string') {
    throw new functions.https.HttpsError('invalid-argument', 'toYorId');
  }
  if (!idempotencyKey || typeof idempotencyKey !== 'string') {
    throw new functions.https.HttpsError('invalid-argument', 'idempotencyKey');
  }

  const idemRef = db.doc('idempotency/' + senderUid + '_' + idempotencyKey);
  const idem = await idemRef.get();
  if (idem.exists) return idem.data().result;

  const yorSnap = await db.doc('yorIds/' + toYorId).get();
  if (!yorSnap.exists) throw new functions.https.HttpsError('not-found', 'recipient');
  const receiverUid = yorSnap.data().uid;
  if (receiverUid === senderUid) throw new functions.https.HttpsError('failed-precondition', 'self');

  const cur = (currency || 'OMR').toUpperCase();
  const senderAccRef = db.doc('users/' + senderUid + '/accounts/main_' + cur.toLowerCase());
  const receiverAccRef = db.doc('users/' + receiverUid + '/accounts/main_' + cur.toLowerCase());
  const txRef = db.collection('transactions').doc();

  const result = await db.runTransaction(async (tx) => {
    const [sSnap, rSnap] = await Promise.all([tx.get(senderAccRef), tx.get(receiverAccRef)]);
    if (!sSnap.exists) throw new functions.https.HttpsError('failed-precondition', 'sender-acct');
    if (!rSnap.exists) throw new functions.https.HttpsError('failed-precondition', 'receiver-acct');
    const sBal = sSnap.data().availableBalance;
    if (sBal < amount) throw new functions.https.HttpsError('failed-precondition', 'balance');

    const now = admin.firestore.FieldValue.serverTimestamp();
    tx.update(senderAccRef, {
      balance: sBal - amount, availableBalance: sBal - amount, updatedAt: now
    });
    tx.update(receiverAccRef, {
      balance: rSnap.data().availableBalance + amount,
      availableBalance: rSnap.data().availableBalance + amount,
      updatedAt: now
    });
    tx.set(txRef, {
      senderUid, receiverUid, senderYorId: null, receiverYorId: toYorId,
      asset: cur, amount, currency: cur, fee: 0, vat: 0, total: amount,
      status: 'CONFIRMED', direction: 'INTERNAL_TRANSFER',
      deviceId: data.deviceId || null, sessionId: data.sessionId || null,
      createdAt: now, completedAt: now
    });
    tx.set(db.doc('users/' + senderUid + '/notifications/' + txRef.id), {
      type: 'TRANSFER_SENT', title: 'Transfer sent',
      message: amount + ' ' + cur + ' sent', transactionId: txRef.id, read: false, createdAt: now
    });
    tx.set(db.doc('users/' + receiverUid + '/notifications/' + txRef.id), {
      type: 'TRANSFER_RECEIVED', title: 'Payment received',
      message: amount + ' ' + cur + ' received', transactionId: txRef.id, read: false, createdAt: now
    });
    tx.set(db.collection('mail').doc(), {
      to: [], template: 'money_sent',
      data: { amount, currency: cur, reference: txRef.id },
      fromUid: senderUid, createdAt: now
    });
    tx.set(db.collection('mail').doc(), {
      to: [], template: 'money_received',
      data: { amount, currency: cur, reference: txRef.id },
      fromUid: senderUid, createdAt: now
    });
    return { ok: true, transactionId: txRef.id };
  });
  await idemRef.set({ result, createdAt: admin.firestore.FieldValue.serverTimestamp() });
  return result;
});

// Admin: credit a user (server-validated).
exports.adminCredit = functions.https.onCall(async (data, ctx) => {
  if (!ctx.auth) throw new functions.https.HttpsError('unauthenticated', 'auth');
  await assertAdmin(ctx.auth.uid);
  const { targetYorId, amount, currency } = data;
  if (!(amount > 0)) throw new functions.https.HttpsError('invalid-argument', 'amount');
  const yorSnap = await db.doc('yorIds/' + targetYorId).get();
  if (!yorSnap.exists) throw new functions.https.HttpsError('not-found', 'user');
  const targetUid = yorSnap.data().uid;
  const cur = (currency || 'OMR').toUpperCase();
  const accRef = db.doc('users/' + targetUid + '/accounts/main_' + cur.toLowerCase());
  await db.runTransaction(async (tx) => {
    const snap = await tx.get(accRef);
    const bal = snap.exists ? snap.data().availableBalance : 0;
    tx.set(accRef, { balance: bal + amount, availableBalance: bal + amount, updatedAt: admin.firestore.FieldValue.serverTimestamp() }, { merge: true });
    tx.set(db.collection('audit').doc(), {
      adminUserId: ctx.auth.uid, action: 'ADMIN_CREDIT',
      targetUserId: targetUid, asset: cur, amount,
      timestamp: admin.firestore.FieldValue.serverTimestamp()
    });
    tx.set(db.doc('users/' + targetUid + '/notifications/' + Date.now()), {
      type: 'DEPOSIT', title: 'Deposit received',
      message: amount + ' ' + cur + ' credited', read: false,
      createdAt: admin.firestore.FieldValue.serverTimestamp()
    });
    tx.set(db.collection('mail').doc(), {
      to: [], template: 'deposit',
      data: { amount, currency: cur }, fromUid: ctx.auth.uid,
      createdAt: admin.firestore.FieldValue.serverTimestamp()
    });
  });
  return { ok: true };
});

// Admin sign-in bootstrap: only accepts the configured code once.
exports.bootstrapAdmin = functions.https.onCall(async (data, ctx) => {
  if (!ctx.auth) throw new functions.https.HttpsError('unauthenticated', 'auth');
  if (data.code !== CONFIRM_CODE) throw new functions.https.HttpsError('permission-denied', 'code');
  const uid = ctx.auth.uid;
  await db.doc('users/' + uid).set({ role: 'admin', updatedAt: admin.firestore.FieldValue.serverTimestamp() }, { merge: true });
  await db.collection('audit').doc().set({
    adminUserId: uid, action: 'ADMIN_BOOTSTRAP',
    timestamp: admin.firestore.FieldValue.serverTimestamp()
  });
  return { ok: true };
});

/* ============================================================
   DEVICE ENGINE — independent from user identity
   ============================================================ */
const DeviceEngine = (() => {
  function readLocal(){
    try { return localStorage.getItem(CONFIG.DEVICE_KEY); } catch(e){ return null; }
  }
  function writeLocal(id){
    try { localStorage.setItem(CONFIG.DEVICE_KEY, id); } catch(e){}
  }
  function describe(){
    const ua = navigator.userAgent || '';
    let platform = 'Web';
    if (/iPhone|iPad|iPod/i.test(ua)) platform = 'iOS';
    else if (/Android/i.test(ua)) platform = 'Android';
    else if (/Macintosh/i.test(ua)) platform = 'macOS';
    else if (/Windows/i.test(ua)) platform = 'Windows';
    else if (/Linux/i.test(ua)) platform = 'Linux';
    let browser = 'Browser';
    if (/Edg\//i.test(ua)) browser = 'Edge';
    else if (/OPR\//i.test(ua)) browser = 'Opera';
    else if (/Chrome\//i.test(ua) && !/Edg\//i.test(ua)) browser = 'Chrome';
    else if (/Safari\//i.test(ua) && !/Chrome/i.test(ua)) browser = 'Safari';
    else if (/Firefox\//i.test(ua)) browser = 'Firefox';
    return { platform, browser, language: navigator.language || 'en' };
  }
  function ensure(){
    let id = readLocal();
    if (!id){ id = ID.device(); writeLocal(id); }
    return id;
  }
  return { ensure, describe, current: () => readLocal() };
})();

/* ============================================================
   SESSION ENGINE — independent from device and user
   ============================================================ */
const SessionEngine = (() => {
  function readLocal(){
    try { return sessionStorage.getItem(CONFIG.SESSION_KEY); } catch(e){ return null; }
  }
  function writeLocal(id){
    try { if (id) sessionStorage.setItem(CONFIG.SESSION_KEY, id); else sessionStorage.removeItem(CONFIG.SESSION_KEY); } catch(e){}
  }
  function start(){ const id = ID.session(); writeLocal(id); return id; }
  function current(){ return readLocal(); }
  function end(){ writeLocal(null); }
  return { start, current, end };
})();

/* ============================================================
   USER CONTEXT — single source of truth for the current session
   ============================================================ */
const UserContext = (() => {
  let ctx = null;
  function reset(){ ctx = null; }
  function set(next){ ctx = next; }
  function get(){ return ctx; }
  function requireCtx(){
    if (!ctx || !ctx.firebaseUid || !ctx.userId) {
      reset();
      throw new Error('NO_USER_CONTEXT');
    }
    return ctx;
  }
  return { set, get, reset, requireCtx };
})();

/* ============================================================
   USER DATA ENGINE — Firestore scoped to current user only
   ============================================================ */
const UserDataEngine = (() => {
  function userRef(uid){ return fb.db.collection('users').doc(uid); }
  function subRef(uid, sub, id){ return userRef(uid).collection(sub).doc(id); }
  function subCol(uid, sub){ return userRef(uid).collection(sub); }
  function docRef(uid, docName){ return userRef(uid).collection('meta').doc(docName); }

  async function readProfile(uid){
    const snap = await userRef(uid).get();
    return snap.exists ? snap.data() : null;
  }
  async function readDoc(uid, docName, fallback){
    const snap = await docRef(uid, docName).get();
    return snap.exists ? snap.data() : fallback;
  }
  async function writeDoc(uid, docName, data){
    await docRef(uid, docName).set(data, { merge: true });
  }
  async function readCollection(uid, sub){
    const snap = await subCol(uid, sub).get();
    const out = [];
    snap.forEach(d => out.push(Object.assign({ id: d.id }, d.data())));
    return out;
  }
  async function writeSub(uid, sub, id, data){
    await subRef(uid, sub, id).set(data, { merge: true });
  }
  async function deleteSub(uid, sub, id){
    await subRef(uid, sub, id).delete();
  }
  async function readAccounts(uid){ return readCollection(uid, 'accounts'); }
  async function readTransactions(uid){
    const snap = await subCol(uid, 'transactions').orderBy('createdAt', 'desc').limit(200).get();
    const out = [];
    snap.forEach(d => out.push(Object.assign({ id: d.id }, d.data())));
    return out;
  }
  async function readReceipts(uid){
    const snap = await subCol(uid, 'receipts').orderBy('createdAt', 'desc').limit(100).get();
    const out = [];
    snap.forEach(d => out.push(Object.assign({ id: d.id }, d.data())));
    return out;
  }
  async function readNotifications(uid){
    const snap = await subCol(uid, 'notifications').orderBy('createdAt', 'desc').limit(100).get();
    const out = [];
    snap.forEach(d => out.push(Object.assign({ id: d.id }, d.data())));
    return out;
  }
  async function readCards(uid){ return readCollection(uid, 'cards'); }
  async function readWallets(uid){ return readCollection(uid, 'cryptoWallets'); }
  async function readBankAccounts(uid){ return readCollection(uid, 'bankAccounts'); }
  async function readContacts(uid){ return readCollection(uid, 'contacts'); }
  async function readBeneficiaries(uid){ return readCollection(uid, 'beneficiaries'); }
  async function readDevices(uid){ return readCollection(uid, 'devices'); }
  async function readSessions(uid){ return readCollection(uid, 'sessions'); }

  return {
    readProfile, readDoc, writeDoc, readAccounts, readTransactions,
    readReceipts, readNotifications, readCards, readWallets,
    readBankAccounts, readContacts, readBeneficiaries,
    readDevices, readSessions, writeSub, deleteSub
  };
})();

const CurrencyEngine = Object.freeze({
  meta(c){ return CURRENCY_DEF[String(c || '').toUpperCase()] || CURRENCY_DEF.USD; },
  format(a, c, locale){
    c = String(c || 'OMR').toUpperCase();
    const m = CurrencyEngine.meta(c);
    const n = Number(a || 0);
    if (!locale) locale = LANG === 'en' ? 'en-US' : LANG === 'ar' ? 'ar-OM' : 'fr-FR';
    if (locale === 'ar-OM')
      return n.toLocaleString('fr-FR', { minimumFractionDigits:m.decimals, maximumFractionDigits:m.decimals }) + ' ' + c;
    return n.toLocaleString(locale, { minimumFractionDigits:m.decimals, maximumFractionDigits:m.decimals }) + ' ' + c;
  },
  formatCrypto(a, sym){
    const s = String(sym || '').toUpperCase();
    const m = CurrencyEngine.meta(s);
    const n = Number(a || 0);
    const maxDec = s === 'BTC' ? 8 : s === 'ETH' ? 6 : Math.min(m.decimals, 8);
    const minDec = n > 0 && n < 0.001 ? 4 : 0;
    return n.toLocaleString('en-US', { minimumFractionDigits:minDec, maximumFractionDigits:maxDec }) + ' ' + s;
  }
});

const ExchangeEngine = Object.freeze({
  isCrypto(sym){ return Object.prototype.hasOwnProperty.call(CRYPTO_PRICES_SEED, String(sym || '').toUpperCase()); },
  cryptoUSD(sym){ return (CRYPTO_PRICES_SEED[String(sym || '').toUpperCase()] || { usd:0 }).usd; },
  rate(from, to){
    if (!from || !to) return null;
    from = String(from).toUpperCase(); to = String(to).toUpperCase();
    if (from === to) return 1;
    const rates = FX_RATES;
    const fc = ExchangeEngine.isCrypto(from);
    const tc = ExchangeEngine.isCrypto(to);
    if (fc && tc){
      const pf = ExchangeEngine.cryptoUSD(from); const pt = ExchangeEngine.cryptoUSD(to);
      return pt > 0 ? pf / pt : null;
    }
    if (fc){
      const pUSD = ExchangeEngine.cryptoUSD(from);
      const rateToOMR = rates['USD'] ? 1 / rates['USD'] : null;
      if (!rateToOMR) return null;
      const omrAmount = pUSD * rateToOMR;
      if (to === 'OMR') return omrAmount;
      return rates[to] != null ? omrAmount * rates[to] : null;
    }
    if (tc){
      const pUSD = ExchangeEngine.cryptoUSD(to);
      if (pUSD <= 0) return null;
      const omrToUSD = rates['USD'] || 2.6008;
      if (from === 'OMR') return (1 * omrToUSD) / pUSD;
      if (rates[from] != null){
        const omrAmount = 1 / rates[from];
        return (omrAmount * omrToUSD) / pUSD;
      }
      return null;
    }
    if (from === 'OMR') return rates[to] != null ? rates[to] : null;
    if (to === 'OMR') return rates[from] != null ? 1 / rates[from] : null;
    if (rates[from] != null && rates[to] != null) return rates[to] / rates[from];
    return null;
  },
  convert(amount, from, to){
    const r = ExchangeEngine.rate(from, to);
    if (r == null) return null;
    return { amount: Math.round(amount * r * 1e8) / 1e8, rate: r, from: String(from).toUpperCase(), to: String(to).toUpperCase() };
  }
});

const FeeEngine = Object.freeze({
  compute(amount, isIntl){
    const fee = isIntl ? CONFIG.FEES.INTERNATIONAL.flatOMR : CONFIG.FEES.LOCAL.flat;
    const vat = Math.round(fee * CONFIG.VAT.rate * 1000) / 1000;
    return { amount, fee, vat, total: Math.round((amount + fee + vat) * 1000) / 1000 };
  },
  cryptoTrade(amountUSD){ return Math.round(amountUSD * CONFIG.FEES.CRYPTO_TRADE_PCT * 100) / 100; },
  cryptoSwap(amountUSD){ return Math.round(amountUSD * CONFIG.FEES.CRYPTO_SWAP_PCT * 100) / 100; },
  cryptoToBank(amount){ return Math.round(amount * CONFIG.FEES.CRYPTO_TO_BANK_PCT * 1e8) / 1e8; }
});

const AddressEngine = Object.freeze({
  validate(networkId, address){
    const a = String(address || '').trim();
    if (a.length < 10) return { ok:false };
    switch(networkId){
      case 'bitcoin': return /^(bc1|[13])[a-zA-HJ-NP-Z0-9]{20,}$/.test(a) ? {ok:true} : {ok:false};
      case 'ethereum': case 'bsc': case 'polygon': return /^0x[a-fA-F0-9]{40}$/.test(a) ? {ok:true} : {ok:false};
      case 'tron': return /^T[a-zA-HJ-NP-Z0-9]{33}$/.test(a) ? {ok:true} : {ok:false};
      case 'solana': return /^[1-9A-HJ-NP-Za-km-z]{32,44}$/.test(a) ? {ok:true} : {ok:false};
      case 'xrp': return /^r[a-zA-HJ-NP-Z0-9]{24,}$/.test(a) ? {ok:true} : {ok:false};
      case 'litecoin': return /^(ltc1|[LM3])[a-zA-HJ-NP-Z0-9]{20,}$/.test(a) ? {ok:true} : {ok:false};
      default: return a.length >= 20 ? {ok:true} : {ok:false};
    }
  },
  short(a){ if (!a || a.length < 14) return a || ''; return a.slice(0, 8) + '…' + a.slice(-6); },
  generate(networkId){
    const rnd = n => { let s = ''; const chars = 'abcdefghijklmnopqrstuvwxyz0123456789'; for (let i = 0; i < n; i++) s += chars[Math.floor(Math.random() * chars.length)]; return s; };
    const rndHex = n => { let s = ''; for (let i = 0; i < n; i++) s += '0123456789abcdef'[Math.floor(Math.random() * 16)]; return s; };
    switch(networkId){
      case 'bitcoin': return 'bc1q' + rnd(38).toLowerCase();
      case 'ethereum': case 'bsc': case 'polygon': return '0x' + rndHex(40);
      case 'tron': return 'T' + rnd(33).toUpperCase();
      case 'solana': return rnd(44);
      case 'xrp': return 'r' + rnd(33);
      case 'litecoin': return 'ltc1q' + rnd(38).toLowerCase();
      default: return rnd(40);
    }
  },
  requiresMemo(networkId){ return networkId === 'xrp'; }
});

const GasFeeEngine = Object.freeze({
  estimate(networkId, asset){

const ContactsEngine = Object.freeze({
  all(){ return Runtime.contacts || []; },
  byNumber(num){
    const digits = String(num || '').replace(/\D/g, '');
    if (!digits || digits.length < 6) return null;
    return ContactsEngine.all().find(c => {
      const cd = String(c.digits || c.number || '').replace(/\D/g, '');
      return cd === digits || (cd.length >= 6 && digits.length >= 6 && (cd.endsWith(digits.slice(-6)) || digits.endsWith(cd.slice(-6))));
    }) || null;
  },
  async add({ number, name, fullName, country }){
    const uid = UserContext.requireCtx().firebaseUid;
    const digits = String(number || '').replace(/\D/g, '');
    if (digits.length < 6) throw new Error('Invalid number');
    if (!name || name.length < 2) throw new Error('Name required');
    const existing = Runtime.contacts.find(c => c.digits === digits);
    const entry = {
      id: existing ? existing.id : ID.contact(),
      number, digits, name: name.toUpperCase(),
      fullName: (fullName || name).toUpperCase(),
      country: country || 'OM',
      verified: true, createdAt: Date.now()
    };
    await UserDataEngine.writeSub(uid, 'contacts', entry.id, entry);
    if (existing) Object.assign(existing, entry); else Runtime.contacts.push(entry);
    return entry;
  },
  async remove(id){
    const uid = UserContext.requireCtx().firebaseUid;
    await UserDataEngine.deleteSub(uid, 'contacts', id);
    Runtime.contacts = Runtime.contacts.filter(c => c.id !== id);
  },
  mask(name){
    if (!name) return '—';
    const clean = String(name).toUpperCase().replace(/\s+/g, '');
    if (clean.length <= 6) return clean;
    const head = clean.slice(0, 3);
    const tail = clean.slice(-4);
    const hash = '#'.repeat(Math.max(3, clean.length - 7));
    return head + hash + tail;
  }
});

const IdentifierEngine = Object.freeze({
  label(type){
    const map = { PHONE:'identifier.phone', IBAN:'identifier.iban', ACCOUNT_NUMBER:'identifier.account',
      ROUTING_ACCOUNT:'identifier.routing', MOBILE_MONEY:'identifier.mobile_money', EMAIL:'identifier.email',
      SERVICE_ID:'identifier.service_id', YOR_ID:'transfer.yor_id_label' };
    return t(map[type] || 'identifier.service_id');
  },
  placeholder(type){
    switch(type){
      case 'PHONE': return '7 79 86 54 44';
      case 'IBAN': return 'AE00 0000 0000 0000 0000 000';
      case 'ACCOUNT_NUMBER': return '0000 0000 0000';
      case 'ROUTING_ACCOUNT': return '021000021 / 1234567890';
      case 'MOBILE_MONEY': return '07 00 00 00 00';
      case 'EMAIL': return 'user@example.com';
      case 'YOR_ID': return 'YOR-XXXXXX';
      case 'SERVICE_ID': return '@username';
      default: return '';
    }
  },
  validate(type, value){
    const v = String(value || '').trim();
    const digits = v.replace(/\D/g, '');
    switch(type){
      case 'PHONE': case 'MOBILE_MONEY': return digits.length >= 6 && digits.length <= 15 ? {ok:true} : {ok:false, reason:t('errors.INVALID_PHONE')};
      case 'IBAN': return /^[A-Z]{2}[0-9]{2}[A-Z0-9]{10,30}$/i.test(v.replace(/\s/g, '')) ? {ok:true} : {ok:false, reason:'IBAN invalid'};
      case 'ACCOUNT_NUMBER': return digits.length >= 6 && digits.length <= 20 ? {ok:true} : {ok:false, reason:t('errors.INVALID_ACCOUNT')};
      case 'ROUTING_ACCOUNT': {
        const parts = v.split('/').map(s => s.trim());
        return parts.length === 2 && /^\d{9}$/.test(parts[0]) && /^\d{6,17}$/.test(parts[1]) ? {ok:true} : {ok:false, reason:'Invalid format'};
      }
      case 'EMAIL': return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v) ? {ok:true} : {ok:false, reason:'Invalid email'};
      case 'YOR_ID': return /^YOR-[A-Z0-9]{6,}$/i.test(v) ? {ok:true} : {ok:false, reason:'Invalid YOR ID'};
      case 'SERVICE_ID': return v.length >= 4 ? {ok:true} : {ok:false, reason:'Invalid identifier'};
      default: return v.length >= 3 ? {ok:true} : {ok:false, reason:'Invalid value'};
    }
  }
});

const CountryTransferEngine = Object.freeze({
  allCountries(){ return Object.values(COUNTRY_TRANSFER_CONFIG); },
  getConfig(iso){ return COUNTRY_TRANSFER_CONFIG[iso] || null; },
  services(iso){
    const c = CountryTransferEngine.getConfig(iso);
    const base = c ? c.services.slice() : [];
    return [INTERNAL_SERVICE_DEF].concat(base);
  },
  getService(iso, serviceId){
    if (serviceId === INTERNAL_SERVICE_DEF.id) return INTERNAL_SERVICE_DEF;
    const c = CountryTransferEngine.getConfig(iso);
    return c ? c.services.find(s => s.id === serviceId) : null;
  },
  recognize({ country, serviceId, identifierType, value }){
    const contact = ContactsEngine.byNumber(value);
    if (contact && (identifierType === 'PHONE' || identifierType === 'MOBILE_MONEY')){
      return { found:true, source:'LINKED_CONTACT', name: contact.fullName, masked: contact.name, phone: contact.number, verified: true };
    }
    const digits = String(value || '').replace(/\D/g, '');
    if (digits.length >= 6){
      const found = (Runtime.beneficiaries || []).find(b => {
        if (b.country !== country) return false;
        const bd = String(b.phone || '').replace(/\D/g, '');
        return bd && bd.endsWith(digits.slice(-6));
      });
      if (found) return { found:true, source:'BENEFICIARY', name: found.name, masked: ContactsEngine.mask(found.name), phone: found.phone, verified: true };
    }
    return { found:false, source:'NEW' };
  }
});

const NotificationEngine = (() => {
  async function add(input){
    const uid = UserContext.requireCtx().firebaseUid;
    const id = ID.notification();
    const n = { type:input.type, title:input.title, message:input.message, read:false, priority: input.priority || 'NORMAL', transactionId: input.transactionId || null, createdAt: Date.now() };
    await UserDataEngine.writeSub(uid, 'notifications', id, n);
    Runtime.notifications.unshift(Object.assign({ id }, n));
    return n;
  }
  async function markAllRead(){
    const uid = UserContext.requireCtx().firebaseUid;
    const updates = Runtime.notifications.map(n => UserDataEngine.writeSub(uid, 'notifications', n.id, { read: true }));
    Runtime.notifications = Runtime.notifications.map(n => Object.assign({}, n, { read: true }));
    await Promise.all(updates);
  }
  return { add, markAllRead };
})();

function applyI18n(){
  document.documentElement.lang = LANG;
  document.documentElement.dir = LANG === 'ar' ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    const val = t(key);
    if (val) el.textContent = val;
  });
}
function applyTheme(mode){
  let eff = mode === 'system' ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : mode;
  document.documentElement.setAttribute('data-theme', eff);
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', eff === 'dark' ? '#050507' : '#F6F6F9');
}
function escapeHtml(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m])); }
function timeAgo(ts){
  const d = Date.now() - ts;
  if (d < 60000) return LANG === 'en' ? 'Just now' : LANG === 'ar' ? 'الآن' : 'À l\'instant';
  const m = Math.floor(d / 60000);
  if (m < 60) return m + ' min';
  const h = Math.floor(m / 60);
  if (h < 24) return h + ' h';
  return new Date(ts).toLocaleDateString(LANG === 'en' ? 'en-GB' : LANG === 'ar' ? 'ar-EG' : 'fr-FR', { day:'2-digit', month:'short' });
}
function fmtDate(ts){ return new Date(ts).toLocaleDateString(LANG === 'en' ? 'en-GB' : LANG === 'ar' ? 'ar-EG' : 'fr-FR', { day:'2-digit', month:'short', year:'numeric' }); }
function fmtTime(ts){ return new Date(ts).toLocaleTimeString('en-US', { hour:'2-digit', minute:'2-digit', hour12:true }); }
function toast(msg, type){
  const c = document.getElementById('toasts');
  if (!c) return;
  const el = document.createElement('div');
  el.className = 'toast ' + (type || '');
  el.textContent = msg;
  c.appendChild(el);
  setTimeout(() => { el.style.transition = 'opacity .28s, transform .28s'; el.style.opacity = '0'; el.style.transform = 'translateY(-8px)'; setTimeout(() => el.remove(), 300); }, 2600);
}

/* ============================================================
   ROUTER
   ============================================================ */
const R = (() => {
  let current = null, curHash = '', token = 0, started = false, bound = false, cleanups = [];
  const stack = [], overlays = [], SCREENS = {};
  const LOCKED = ['processing','tx-network-validation','tx-confirmation','boot'];
  const PUBLIC_SCREENS = ['login','signup','reset'];
  const PARENT = {
    'settings':'home', 'banks':'home', 'banks-add':'banks', 'contact-add':'settings',
    'cards':'home', 'cards-add':'cards', 'notifications':'home', 'profile':'home',
    'crypto-market':'crypto', 'crypto-networks':'crypto', 'crypto-spot':'crypto',
    'crypto-buy':'crypto', 'crypto-buy-amount':'crypto-buy',
    'crypto-sell':'crypto', 'crypto-sell-amount':'crypto-sell',
    'crypto-swap':'crypto', 'crypto-swap-to':'crypto-swap', 'crypto-swap-amount':'crypto-swap-to',
    'crypto-send':'crypto', 'crypto-send-network':'crypto-send', 'crypto-send-address':'crypto-send-network', 'crypto-send-amount':'crypto-send-address',
    'crypto-review':'crypto', 'crypto-receive':'crypto', 'crypto-receive-address':'crypto-receive',
    'crypto-to-bank':'crypto', 'crypto-to-bank-account':'crypto-to-bank',
    'crypto-to-bank-amount':'crypto-to-bank-account', 'crypto-bank-review':'crypto-to-bank-amount',
    'country-select':'home', 'service-select':'country-select', 'identifier-input':'service-select',
    'tx-amount':'identifier-input', 'tx-review':'tx-amount', 'receipt':'home',
    'devices':'settings', 'sessions':'settings', 'history':'home'
  };
  const NAV_KEYS = {
    'home':'home','history':'history','cards':'cards','profile':'profile','settings':'settings','banks':'banks','banks-add':'banks',
    'crypto':'crypto','crypto-market':'crypto','crypto-networks':'crypto','crypto-spot':'crypto',
    'crypto-buy':'crypto','crypto-buy-amount':'crypto','crypto-sell':'crypto','crypto-sell-amount':'crypto',
    'crypto-swap':'crypto','crypto-swap-to':'crypto','crypto-swap-amount':'crypto',
    'crypto-send':'crypto','crypto-send-network':'crypto','crypto-send-address':'crypto','crypto-send-amount':'crypto',
    'crypto-review':'crypto','crypto-receive':'crypto','crypto-receive-address':'crypto',
    'crypto-to-bank':'crypto','crypto-to-bank-account':'crypto','crypto-to-bank-amount':'crypto','crypto-bank-review':'crypto'
  };
  function register(map){ Object.assign(SCREENS, map); }
  function onLeave(fn){ if (typeof fn === 'function') cleanups.push(fn); }
  function runCleanups(){ const l = cleanups; cleanups = []; l.forEach(fn => { try { fn(); } catch(e){} }); }
  function pathOf(id){ return '#/' + id.split('-').join('/'); }
  function parse(h){
    const p = String(h || '').replace(/^#\/?/, '').split('/').filter(Boolean);
    for (let k = p.length; k > 0; k--){ const id = p.slice(0, k).join('-'); if (SCREENS[id]) return { id, rest: p.slice(k) }; }
    return null;
  }
  function setHash(h){ try { if (location.hash !== h) history.replaceState(history.state, '', h); } catch(e){} }
  function syncHash(id){ const c = parse(location.hash); if (!c || c.id !== id) setHash(pathOf(id)); }
  function sync(id){ syncHash(id); curHash = location.hash; }
  function arm(){ try { if (!(history.state && history.state.yorTop)) history.pushState({ yorTop:true }, '', location.href); } catch(e){} }
  function chrome(id){
    const nav = document.getElementById('bottom-nav');
    const hideNav = /^settings|^banks-add|^contact-add|^cards-add|^login|^signup|^reset|^devices|^sessions/.test(id);
    if (nav) nav.hidden = hideNav;
    const m = document.getElementById('main'); if (m) m.classList.toggle('no-nav', hideNav);
    const key = NAV_KEYS[id];
    document.querySelectorAll('.nav-item,.side-item').forEach(a => {
      const on = !!key && a.getAttribute('data-nav') === key;
      if (a.classList.contains('side-item')) a.classList.toggle('active', on);
      if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
  }
  function go(id, opts){
    opts = opts || {};
    if (current === id && !opts.force){ sync(id); return; }
    const fn = SCREENS[id];
    if (!fn){ console.warn('[R] no screen for', id); return; }
    /* Auth guard */
    if (PUBLIC_SCREENS.indexOf(id) === -1 && !AuthEngine.hasValidContext() && id !== 'boot'){
      return go('login', { reset:true, force:true });
    }
    if (PUBLIC_SCREENS.indexOf(id) !== -1 && AuthEngine.hasValidContext()){
      return go('home', { reset:true, force:true });
    }
    if (opts.hash) setHash(opts.hash);
    const my = ++token;
    runCleanups(); closeAll(true);
    let html;
    try { html = fn(); } catch(e){ console.error('[R] render', id, e); return; }
    if (my !== token || !html) return;
    const from = current;
    if (opts.reset){ stack.length = 0; }
    else if (from && from !== id && !opts.back && !opts.replace){ stack.push(from); if (stack.length > 40) stack.shift(); }
    const container = document.getElementById('screens');
    let el = document.getElementById(id);
    if (!el){ el = document.createElement('section'); el.id = id; el.className = 'screen'; container.appendChild(el); }
    el.innerHTML = html;
    document.querySelectorAll('.screen').forEach(s => { if (s !== el) s.classList.remove('active'); });
    el.classList.toggle('from-back', !!opts.back);
    el.classList.add('active');
    el.scrollTop = 0;
    current = id;
    if (id === 'receipt'){ stack.length = 0; stack.push('home'); }
    sync(id);
    if (stack.length) arm();
    chrome(id);
    wire(id);
    UIKit.enhanceSync(el);
  }
  function back(){
    if (overlays.length){ closeTop(); return; }
    if (LOCKED.includes(current)) return;
    if (stack.length){ go(stack.pop(), { back:true }); return; }
    if (PARENT[current]){ go(PARENT[current], { back:true }); return; }
    if (current !== 'home') go('home', { back:true });
  }
  function home(){ stack.length = 0; go('home', { reset:true }); }
  function open(html, o){
    o = o || {};
    let root = document.getElementById('ov-root');
    if (!root){ root = document.createElement('div'); root.id = 'ov-root'; root.className = 'ov-root'; document.body.appendChild(root); }
    const wrap = document.createElement('div');
    wrap.className = 'ov' + (o.kind === 'modal' ? ' is-modal' : '');
    wrap.innerHTML = '<div class="ov-backdrop"></div><div class="ov-panel" role="dialog" aria-modal="true" tabindex="-1">' + html + '</div>';
    const rec = { wrap, panel: wrap.querySelector('.ov-panel'), prev: document.activeElement, onClose: o.onClose, dismissible: o.dismissible !== false, closed:false };
    root.appendChild(wrap); overlays.push(rec);
    wrap.querySelector('.ov-backdrop').addEventListener('click', () => { if (rec.dismissible) closeRec(rec); });
    requestAnimationFrame(() => { wrap.classList.add('is-open'); try { rec.panel.focus({ preventScroll:true }); } catch(e){} });
    arm();
    return () => closeRec(rec);
  }
  function closeRec(rec, instant){
    if (rec.closed) return; rec.closed = true;
    const i = overlays.indexOf(rec); if (i >= 0) overlays.splice(i, 1);
    rec.wrap.classList.remove('is-open');
    const done = () => { if (rec.wrap.parentNode) rec.wrap.parentNode.removeChild(rec.wrap); };
    if (instant) done(); else setTimeout(done, 340);
    if (typeof rec.onClose === 'function'){ try { rec.onClose(); } catch(e){} }
  }
  function closeTop(){ const r = overlays[overlays.length - 1]; if (r && r.dismissible) closeRec(r); }
  function closeAll(instant){ overlays.slice().forEach(r => closeRec(r, instant)); }
  function bind(){
    if (bound) return; bound = true;
    try { history.replaceState({ yorBase:true }, '', location.href); history.pushState({ yorTop:true }, '', location.href); } catch(e){}
    window.addEventListener('popstate', e => {
      if (!started || !(e.state && e.state.yorBase)) return;
      if (current) setHash(curHash);
      if (overlays.length){ arm(); closeTop(); return; }
      if (LOCKED.includes(current)){ arm(); return; }
      if (stack.length || (current && current !== 'home')){ arm(); back(); }
    });
    window.addEventListener('hashchange', () => {
      if (!started) return;
      const st = history.state;
      if (!st || (!st.yorBase && !st.yorTop)){ try { history.replaceState({ yorBase:true }, '', location.href); } catch(e){} }
      const r = parse(location.hash);
      if (!r){ if (current) setHash(curHash); return; }
      if (r.id === current){ if (location.hash !== curHash){ curHash = location.hash; go(r.id, { force:true }); } return; }
      go(r.id, { fromHash:true });
    });
    document.addEventListener('keydown', e => {
      if (!overlays.length) return;
      if (e.key === 'Escape'){ e.preventDefault(); closeTop(); return; }
      if (e.key !== 'Tab') return;
      const p = overlays[overlays.length - 1].panel;
      const f = p.querySelectorAll('a[href],button:not([disabled]),input:not([disabled]),select,textarea,[tabindex]:not([tabindex="-1"])');
      if (!f.length){ e.preventDefault(); p.focus(); return; }
      const first = f[0], last = f[f.length - 1], ae = document.activeElement;
      if (e.shiftKey && (ae === first || ae === p)){ e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && ae === last){ e.preventDefault(); first.focus(); }
    });
  }
  function start(){
    if (started) return; started = true;
    if (AuthEngine.hasValidContext()) R.go('home', { reset:true });
    else R.go('login', { reset:true });
  }
  return { go, back, home, start, bind, current: () => current, register, onLeave, overlay:{ open, close:closeTop, isOpen:() => overlays.length > 0 } };
})();

/* ============================================================
   AUTH ENGINE — Firebase Auth + Firestore context
   ============================================================ */
const AuthEngine = (() => {
  let unsub = null;
  function hasValidContext(){
    const c = UserContext.get();
    return !!(c && c.firebaseUid && c.userId && c.yorId);
  }
  function errorKey(err){
    if (!err) return 'auth.err.unavailable';
    const code = err.code || '';
    if (code === 'auth/invalid-email') return 'auth.err.invalidEmail';
    if (code === 'auth/user-not-found') return 'auth.err.userNotFound';
    if (code === 'auth/wrong-password' || code === 'auth/invalid-credential') return 'auth.err.wrongPassword';
    if (code === 'auth/email-already-in-use') return 'auth.err.emailInUse';
    if (code === 'auth/weak-password') return 'auth.err.weak';
    if (code === 'auth/too-many-requests') return 'auth.err.tooMany';
    if (code === 'auth/network-request-failed') return 'auth.err.network';
    return 'auth.err.unavailable';
  }
  async function loadContextFromUser(fbUser){
    if (!fbUser || !fbUser.uid) return null;
    const profile = await UserDataEngine.readProfile(fbUser.uid);
    if (!profile){ return null; }
    const deviceId = DeviceEngine.ensure();
    const deviceInfo = DeviceEngine.describe();
    const now = Date.now();
    /* Register device if new */
    await UserDataEngine.writeSub(fbUser.uid, 'devices', deviceId, {
      deviceId, platform: deviceInfo.platform, browser: deviceInfo.browser,
      language: deviceInfo.language, lastSeen: now, status: 'active',
      createdAt: now
    });
    /* Session */
    let sessionId = SessionEngine.current();
    if (!sessionId){ sessionId = SessionEngine.start(); }
    await UserDataEngine.writeSub(fbUser.uid, 'sessions', sessionId, {
      sessionId, deviceId, firebaseUid: fbUser.uid,
      createdAt: now, lastActiveAt: now, status: 'active'
    });
    return {
      firebaseUid: fbUser.uid,
      userId: profile.userId,
      yorId: profile.yorId,
      role: profile.role || 'user',
      deviceId, sessionId
    };
  }
  async function hydrateRuntime(){
    const c = UserContext.requireCtx();
    const uid = c.firebaseUid;
    const [profile, settingsDoc, securityDoc, accounts, transactions, receipts, notifications, cards, wallets, bankAccounts, contacts, beneficiaries, devices, sessions] = await Promise.all([
      UserDataEngine.readProfile(uid),
      UserDataEngine.readDoc(uid, 'preferences', {}),
      UserDataEngine.readDoc(uid, 'security', {}),
      UserDataEngine.readAccounts(uid),
      UserDataEngine.readTransactions(uid),
      UserDataEngine.readReceipts(uid),
      UserDataEngine.readNotifications(uid),
      UserDataEngine.readCards(uid),
      UserDataEngine.readWallets(uid),
      UserDataEngine.readBankAccounts(uid),
      UserDataEngine.readContacts(uid),
      UserDataEngine.readBeneficiaries(uid),
      UserDataEngine.readDevices(uid),
      UserDataEngine.readSessions(uid)
    ]);
    Runtime.ctx = c;
    Runtime.profile = profile;
    Runtime.settings = settingsDoc || {};
    Runtime.security = securityDoc || {};
    Runtime.accounts = accounts || [];
    Runtime.transactions = transactions || [];
    Runtime.receipts = receipts || [];
    Runtime.notifications = notifications || [];
    Runtime.cards = cards || [];
    Runtime.wallets = wallets || [];
    Runtime.bankAccounts = bankAccounts || [];
    Runtime.contacts = contacts || [];
    Runtime.beneficiaries = beneficiaries || [];
    Runtime.devices = devices || [];
    Runtime.sessions = sessions || [];
    Runtime.hideBalance = !!Runtime.settings.hideBalances;
    LANG = Runtime.settings.language || 'en';
    return Runtime;
  }
  function subscribe(onChange){
    if (unsub) unsub();
    if (!firebaseReady) return;
    unsub = fb.auth.onAuthStateChanged(async (fbUser) => {
      if (fbUser){
        try {
          const ctx = await loadContextFromUser(fbUser);
          if (ctx){
            UserContext.set(ctx);
            await hydrateRuntime();
            if (typeof onChange === 'function') onChange(true);
            return;
          }
        } catch(e){ console.warn('context load failed', e); }
      }
      UserContext.reset();
      resetRuntime();
      SessionEngine.end();
      if (typeof onChange === 'function') onChange(false);
    });
  }
  async function signIn(email, password){
    if (!firebaseReady) return { ok:false, error:'auth.err.unavailable' };
    try {
      await fb.auth.signInWithEmailAndPassword(String(email).trim(), String(password));
      return { ok:true };
    } catch(e){ return { ok:false, error: errorKey(e) }; }
  }
  async function signUp(email, password, firstName, lastName){
    if (!firebaseReady) return { ok:false, error:'auth.err.unavailable' };
    try {
      const cred = await fb.auth.createUserWithEmailAndPassword(String(email).trim(), String(password));
      /* Fill the profile firstName/lastName in Firestore. */
      try {
        await fb.db.collection('users').doc(cred.user.uid).set({
          firstName: (firstName || '').trim(),
          lastName: (lastName || '').trim(),
          email: cred.user.email,
          updatedAt: Date.now()
        }, { merge: true });
      } catch(e){}
      return { ok:true };
    } catch(e){ return { ok:false, error: errorKey(e) }; }
  }
  async function signOut(){
    if (!firebaseReady) return;
    const c = UserContext.get();
    if (c){
      try {
        await UserDataEngine.writeSub(c.firebaseUid, 'sessions', c.sessionId, { status:'signed_out', lastActiveAt: Date.now() });
      } catch(e){}
    }
    try { await fb.auth.signOut(); } catch(e){}
    UserContext.reset();
    resetRuntime();
    SessionEngine.end();
  }
  async function sendReset(email){
    if (!firebaseReady) return { ok:false, error:'auth.err.unavailable' };
    try {
      await fb.auth.sendPasswordResetEmail(String(email).trim());
      return { ok:true };
    } catch(e){ return { ok:false, error: errorKey(e) }; }
  }
  return { subscribe, signIn, signUp, signOut, sendReset, hasValidContext, hydrateRuntime };
})();

/* ============================================================
   TRANSFER ENGINE — delegates to Cloud Function (server-authoritative)
   ============================================================ */
const TransferEngine = (() => {
  const inflight = new Set();
  async function resolveYorId(yorId){
    if (!firebaseReady) return null;
    const key = String(yorId || '').trim().toUpperCase();
    if (!key) return null;
    const snap = await fb.db.collection('yorIds').doc(key).get();
    if (!snap.exists) return null;
    const uid = snap.data().uid;
    const profile = await UserDataEngine.readProfile(uid);
    if (!profile) return null;
    return {
      firebaseUid: uid,
      userId: profile.userId,
      yorId: profile.yorId,
      name: ((profile.firstName || '') + ' ' + (profile.lastName || '')).trim() || profile.yorId,
      phone: profile.phone || '',
      country: profile.country || 'OM',
      role: profile.role || 'user'
    };
  }
  async function sendFiat({ toYorId, amount, currency, deviceId, sessionId }){
    if (!firebaseReady || !fb.fns) return { ok:false, error:'errors.UNKNOWN_ERROR' };
    const idem = uuid();
    const lock = String(toYorId) + ':' + amount + ':' + currency;
    if (inflight.has(lock)) return { ok:false, error:'errors.DUPLICATE' };
    inflight.add(lock);
    try {
      const callable = fb.fns.httpsCallable('transferFiat');
      const res = await callable({ toYorId, amount: Number(amount), currency: currency || 'OMR', idempotencyKey: idem, deviceId, sessionId });
      return { ok:true, data: res.data };
    } catch(e){
      const msg = (e && e.message) || '';
      if (/balance/i.test(msg)) return { ok:false, error:'errors.INSUFFICIENT_BALANCE' };
      if (/recipient/i.test(msg)) return { ok:false, error:'errors.RECIPIENT_NOT_FOUND' };
      if (/self/i.test(msg)) return { ok:false, error:'errors.SELF_TRANSFER' };
      return { ok:false, error:'errors.UNKNOWN_ERROR' };
    } finally {
      setTimeout(() => inflight.delete(lock), 1500);
    }
  }
  return { resolveYorId, sendFiat };
})();

const ProcessingEngine = (() => {
  let state = null, _globalLock = false;
  function acquireLock(){ if (_globalLock) return false; _globalLock = true; return true; }
  function releaseLock(){ _globalLock = false; }
  function start(onDone, opts){
    opts = opts || {};
    const duration = opts.duration || CONFIG.PROCESSING.durationMs;
    state = { active:true, startTime: Date.now(), duration };
    const numEl = document.getElementById('proc-num');
    const ringEl = document.getElementById('ring-fg');
    const C = 2 * Math.PI * 80;
    const FRAME = 100;
    let lastRun = 0;
    function tick(){
      if (!state.active) return;
      const now = Date.now();
      const elapsed = now - state.startTime;
      const progress = Math.min(elapsed / duration, 1);
      if (now - lastRun < FRAME - 5 && progress < 1){ requestAnimationFrame(tick); return; }
      lastRun = now;
      if (ringEl) ringEl.style.strokeDashoffset = String(C * (1 - progress));
      if (numEl) numEl.textContent = String(Math.max(0, Math.ceil((duration - elapsed) / 1000)));
      if (progress >= 1){ state.active = false; setTimeout(() => { releaseLock(); onDone && onDone(); }, 250); return; }
      requestAnimationFrame(tick);
    }
    tick();
  }
  return { start, acquireLock, releaseLock };
})();

function luhnGenerateCardNumber(prefix, length){
  length = length || 16;
  let base = String(prefix || '4532');
  while (base.length < length - 1) base += String(Math.floor(Math.random() * 10));
  let sum = 0, alt = true;
  for (let i = base.length - 1; i >= 0; i--){
    let n = parseInt(base.charAt(i), 10);
    if (alt){ n *= 2; if (n > 9) n -= 9; }
    sum += n;
    alt = !alt;
  }
  const check = (10 - (sum % 10)) % 10;
  return base + String(check);
}

function qrSvgFor(text){
  const seed = String(text || '');
  const size = 29;
  let s = 0; for (let i = 0; i < seed.length; i++) s = (s * 31 + seed.charCodeAt(i)) >>> 0;
  function rnd(){ s = (s * 1103515245 + 12345) >>> 0; return s / 4294967296; }
  const cells = [];
  function finder(ox, oy){ for (let y = 0; y < 7; y++) for (let x = 0; x < 7; x++){ const on = (x === 0 || x === 6 || y === 0 || y === 6) || (x >= 2 && x <= 4 && y >= 2 && y <= 4); if (on) cells.push([ox + x, oy + y]); } }
  finder(0, 0); finder(size - 7, 0); finder(0, size - 7);
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++){ if ((x < 8 && y < 8) || (x >= size - 8 && y < 8) || (x < 8 && y >= size - 8)) continue; if (rnd() > 0.55) cells.push([x, y]); }
  const rects = cells.map(([x, y]) => '<rect x="' + x + '" y="' + y + '" width="1" height="1"/>').join('');
  return '<svg viewBox="0 0 ' + size + ' ' + size + '" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg"><rect width="' + size + '" height="' + size + '" fill="#fff"/><g fill="#0A0A14">' + rects + '</g></svg>';
}

const _sparkCache = new Map();
function sparklineSvg(symbol, w, h){
  w = w || 72; h = h || 32;
  const key = symbol + '|' + w + '|' + h;
  const cached = _sparkCache.get(key);
  if (cached) return cached;
  const seed = String(symbol || 'X').split('').reduce((a, c) => a + c.charCodeAt(0), 7);
  let s = seed >>> 0;
  function rnd(){ s = (s * 1103515245 + 12345) >>> 0; return s / 4294967296; }
  const n = 20, pts = []; let v = 0.5;
  for (let i = 0; i < n; i++){ v += (rnd() - 0.5) * 0.22; v = Math.max(0.08, Math.min(0.92, v)); pts.push(v); }
  const stepX = w / (n - 1);
  const path = pts.map((p, i) => (i === 0 ? 'M' : 'L') + (i * stepX).toFixed(2) + ' ' + ((1 - p) * h).toFixed(2)).join(' ');
  const up = pts[pts.length - 1] >= pts[0];
  const color = up ? '#10B981' : '#EF4444';
  const out = '<svg viewBox="0 0 ' + w + ' ' + h + '" fill="none" preserveAspectRatio="none"><path d="' + path + '" stroke="' + color + '" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  _sparkCache.set(key, out);
  return out;
}

function downloadBlob(filename, content, mime){
  try {
    const blob = new Blob([content], { type: mime || 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename; a.style.display = 'none';
    document.body.appendChild(a); a.click();
    setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 3000);
    return true;
  } catch(e){ return false; }
}

function renderMarketRows(assets, sortBy){

const UIKit = (() => {
  const LABELS = { back:'ui.back', notifications:'ui.notifications', 'mark-notifs':'ui.markRead', 'toggle-balance':'ui.toggleBalance', share:'ui.share', 'share-receipt':'ui.share', download:'action.download', 'download-receipt':'action.download', 'contact-remove':'ui.remove', 'crypto-market':'ui.market', 'banks-add':'ui.addBank', 'card-toggle-number':'cards.showNumber', 'card-toggle-cvv':'cards.showCvv', 'settings-toggle-notifs':'settings.notifs', 'settings-toggle-biometric':'settings.biometric', 'settings-toggle-txconfirm':'settings.txConfirm', 'settings-toggle-vibration':'settings.vibration', 'copy':'action.copy', 'sign-out':'profile.logout' };
  const NATIVE = { BUTTON:1, A:1, INPUT:1, SELECT:1, TEXTAREA:1, SUMMARY:1 };
  const GUARD_MS = 450;
  let started = false, raf = 0, timer = 0, _lastEnhance = 0;
  function haptic(kind){
    try {
      if (Runtime.settings && Runtime.settings.vibration === false) return;
      if (!navigator.vibrate) return;
      navigator.vibrate(kind === 'success' ? [12, 40, 12] : kind === 'error' ? [40, 30, 40] : 8);
    } catch(e){}
  }
  function loading(btn, on){
    if (!btn) return;
    btn.classList.toggle('is-loading', !!on);
    if (on){ btn.setAttribute('aria-busy', 'true'); btn.disabled = true; }
    else { btn.removeAttribute('aria-busy'); btn.disabled = false; }
  }
  function labelFor(el){
    const k = el.getAttribute('data-action') || el.getAttribute('data-nav') || '';
    if (LABELS[k]) return t(LABELS[k]);
    if (el.classList.contains('topbar-back')) return t('ui.back');
    return '';
  }
  function enhance(root){
    if (!root || !root.querySelectorAll) return;
    root.querySelectorAll('button,[role="button"],a[data-nav]').forEach(el => {
      if (el.hasAttribute('aria-label') || el.hasAttribute('aria-labelledby')) return;
      if ((el.textContent || '').trim()) return;
      const l = labelFor(el); if (l) el.setAttribute('aria-label', l);
    });
    root.querySelectorAll('[data-action="toggle-balance"]').forEach(el => { el.setAttribute('aria-pressed', Runtime.hideBalance ? 'true' : 'false'); });
    root.querySelectorAll('.item,.select-item,.country-row,.service-pill,.contact-card,[data-action],[data-nav]').forEach(el => {
      if (NATIVE[el.tagName]) return;
      if (el.onclick){ if (!el.hasAttribute('role')) el.setAttribute('role', 'button'); if (!el.hasAttribute('tabindex')) el.setAttribute('tabindex', '0'); }
    });
    root.querySelectorAll('button.select-item').forEach(el => { el.setAttribute('aria-pressed', el.classList.contains('selected') ? 'true' : 'false'); });
    root.querySelectorAll('.field').forEach(f => {
      const lab = f.querySelector('label.field-label'), inp = f.querySelector('input,select,textarea');
      if (!lab || !inp) return;
      if (!inp.id) inp.id = 'f-' + Math.random().toString(36).slice(2, 8);
      if (!lab.getAttribute('for')) lab.setAttribute('for', inp.id);
    });
    root.querySelectorAll('.field-err').forEach(e => { if (!e.hasAttribute('role')) e.setAttribute('role', 'alert'); });
    root.querySelectorAll('input.ltr:not([lang])').forEach(inp => inp.setAttribute('lang', 'en'));
  }
  function enhanceAll(){
    raf = 0; timer = 0; _lastEnhance = Date.now();
    enhance(document.querySelector('.screen.active'));
    enhance(document.getElementById('bottom-nav'));
    enhance(document.getElementById('side-nav'));
    const tc = document.getElementById('toasts'); if (tc && !tc.getAttribute('role')) tc.setAttribute('role', 'status');
  }
  function schedule(){
    if (raf || timer) return;
    const since = Date.now() - _lastEnhance;
    const delay = since >= 30 ? 0 : (30 - since);
    if (delay === 0) raf = requestAnimationFrame(enhanceAll);
    else timer = setTimeout(enhanceAll, delay);
  }
  function enhanceSync(root){ enhance(root); _lastEnhance = Date.now(); }
  function init(){
    if (started) return; started = true;
    document.addEventListener('click', e => {
      const b = e.target && e.target.closest ? e.target.closest('.btn') : null;
      if (!b || b.disabled) return;
      const now = Date.now();
      if (b.__until && b.__until > now){ e.stopImmediatePropagation(); e.preventDefault(); return; }
      b.__until = now + GUARD_MS;
      haptic('tap');
    }, true);
    document.addEventListener('keydown', e => {
      const el = e.target;
      if (!el || !el.getAttribute) return;
      if ((e.key === 'Enter' || e.key === ' ') && el.getAttribute('role') === 'button' && !NATIVE[el.tagName]){ e.preventDefault(); el.click(); return; }
      if (e.key === 'Enter' && el.tagName === 'INPUT' && !el.isComposing){
        const scr = el.closest('.screen.active'); if (!scr) return;
        const prim = scr.querySelectorAll('.btn-primary[id]');
        if (prim.length === 1 && !prim[0].disabled){ e.preventDefault(); prim[0].click(); }
      }
    });
    const host = document.getElementById('app');
    if (host && window.MutationObserver) new MutationObserver(schedule).observe(host, { childList:true, subtree:true });
    schedule();
  }
  return { init, enhance, enhanceSync, enhanceAll, schedule, haptic, loading };
})();

          Runtime.settings.biometricConfirmation = next;

      function move(e){

function wireLogin(){
  const $ = x => document.getElementById(x);
  let busy = false;
  document.querySelectorAll('[data-auth-toggle]').forEach(btn => {
    btn.onclick = () => {
      const inp = $(btn.getAttribute('data-auth-toggle'));
      if (!inp) return;
      const show = inp.type === 'password';
      inp.type = show ? 'text' : 'password';
      btn.setAttribute('aria-label', t(show ? 'auth.hide' : 'auth.show'));
    };
  });
  function clearErr(){ document.querySelectorAll('#login .field-err').forEach(e => e.textContent = ''); }
  async function submit(){
    if (busy) return;
    clearErr();
    const email = $('au-email').value.trim();
    const pass = $('au-pass').value;
    if (!email || !pass){ $('login-err').textContent = t('auth.err.empty'); return; }
    busy = true;
    const btn = $('au-submit'); UIKit.loading(btn, true);
    const res = await AuthEngine.signIn(email, pass);
    if (!res.ok){
      busy = false;
      UIKit.loading(btn, false);
      $('login-err').textContent = t(res.error);
      try { if (navigator.vibrate) navigator.vibrate([40, 40, 40]); } catch(e){}
      return;
    }
    /* onAuthStateChanged will hydrate and route home */
  }
  const btn = $('au-submit'); if (btn) btn.onclick = submit;
  document.querySelectorAll('#login input').forEach(inp => inp.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); submit(); } }));
  const toSignup = $('au-to-signup'); if (toSignup) toSignup.onclick = () => R.go('signup');
  const toReset = $('au-to-reset'); if (toReset) toReset.onclick = () => R.go('reset');
}

function wireSignup(){
  const $ = x => document.getElementById(x);
  let busy = false;
  document.querySelectorAll('[data-auth-toggle]').forEach(btn => {
    btn.onclick = () => {
      const inp = $(btn.getAttribute('data-auth-toggle'));
      if (!inp) return;
      const show = inp.type === 'password';
      inp.type = show ? 'text' : 'password';
      btn.setAttribute('aria-label', t(show ? 'auth.hide' : 'auth.show'));
    };
  });
  async function submit(){
    if (busy) return;
    const err = $('signup-err'); err.textContent = '';
    const first = $('su-first').value.trim();
    const last = $('su-last').value.trim();
    const email = $('su-email').value.trim();
    const pass = $('su-pass').value;
    if (!email || !pass){ err.textContent = t('auth.err.empty'); return; }
    if (pass.length < 8){ err.textContent = t('auth.err.weak'); return; }
    busy = true;
    const btn = $('su-submit'); UIKit.loading(btn, true);
    const res = await AuthEngine.signUp(email, pass, first, last);
    if (!res.ok){
      busy = false;
      UIKit.loading(btn, false);
      err.textContent = t(res.error);
      return;
    }
    /* onAuthStateChanged will route home */
  }
  const btn = $('su-submit'); if (btn) btn.onclick = submit;
  document.querySelectorAll('#signup input').forEach(inp => inp.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); submit(); } }));
  const toLogin = $('su-to-login'); if (toLogin) toLogin.onclick = () => R.go('login');
}

function wireReset(){
  const $ = x => document.getElementById(x);
  let busy = false;
  async function submit(){
    if (busy) return;
    const err = $('reset-err'); err.textContent = '';
    const email = $('rs-email').value.trim();
    if (!email){ err.textContent = t('auth.err.empty'); return; }
    busy = true;
    const btn = $('rs-submit'); UIKit.loading(btn, true);
    const res = await AuthEngine.sendReset(email);
    busy = false;
    UIKit.loading(btn, false);
    if (res.ok){ toast(t('auth.resetSent'), 'success'); R.go('login'); }
    else { err.textContent = t(res.error); }
  }
  const btn = $('rs-submit'); if (btn) btn.onclick = submit;
  document.querySelectorAll('#reset input').forEach(inp => inp.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); submit(); } }));
}

/* ============================================================
   SIDEBAR
   ============================================================ */
function renderSidebar(){
  document.getElementById('sidebar-logo').innerHTML = logoLockup(48);
  const items = [
    { nav:'home', icon:'home', key:'nav.home' },
    { nav:'crypto', icon:'crypto', key:'crypto.title' },
    { nav:'history', icon:'history', key:'nav.history' },
    { nav:'banks', icon:'bank', key:'banks.title' },
    { nav:'cards', icon:'cards', key:'nav.cards' },
    { nav:'profile', icon:'profile', key:'nav.profile' },
    { nav:'settings', icon:'settings', key:'settings.title' }
  ];
  const nav = document.getElementById('side-nav');
  nav.innerHTML = items.map(it => '<a class="side-item" data-nav="' + it.nav + '">' + icon(it.icon, 20) + '<span>' + t(it.key) + '</span></a>').join('');
  nav.querySelectorAll('[data-nav]').forEach(el => {
    el.onclick = () => {
      const n = el.getAttribute('data-nav');
      if (n === 'home') R.go('home');
      else if (n === 'history') R.go('history');
      else if (n === 'cards') R.go('cards');
      else if (n === 'profile') R.go('profile');
      else if (n === 'settings') R.go('settings');
      else if (n === 'crypto') R.go('crypto');
      else if (n === 'banks') R.go('banks');
    };
  });
  const container = document.getElementById('sidebar-profile');
  if (Runtime.ctx && Runtime.profile){
    const first = Runtime.profile.firstName || '';
    const last = Runtime.profile.lastName || '';
    const initials = ((first[0] || 'U') + (last[0] || 'S')).toUpperCase();
    const isAdmin = Runtime.ctx.role === 'admin';
    container.innerHTML = '<div style="display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:var(--glass-1);border:1px solid var(--border)"><div style="width:36px;height:36px;border-radius:50%;background:linear-gradient(180deg,var(--accent),var(--accent-600));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px">' + initials + '</div><div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + escapeHtml((first + ' ' + last).trim() || Runtime.ctx.yorId || '') + (isAdmin ? ' · ADMIN' : '') + '</div><div style="font-size:11px;color:var(--text-3)">' + escapeHtml(Runtime.ctx.yorId || '') + '</div></div></div>';
  } else {
    container.innerHTML = '';
  }
  container.onclick = () => R.go('profile');
}

/* ============================================================
   FULLSCREEN
   ============================================================ */
function requestFullscreen(){
  try {
    const el = document.documentElement;
    const fn = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
    if (fn && !document.fullscreenElement && !document.webkitFullscreenElement){ fn.call(el).catch(() => {}); }
  } catch(e){}
}

/* ============================================================
   VIEWPORT ENGINE
   ============================================================ */
const ViewportEngine = (() => {
  const root = document.documentElement;
  const vv = window.visualViewport || null;
  let kbOpen = false;
  function setVH(){
    const h = vv ? vv.height : window.innerHeight;
    root.style.setProperty('--vh', (h * 0.01) + 'px');
  }
  function onViewportChange(){
    setVH();
    if (!vv) return;
    const kb = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
    root.style.setProperty('--kb', kb + 'px');
    const open = kb > 80;
    if (open !== kbOpen){ kbOpen = open; document.body.classList.toggle('kb-open', kbOpen); }
  }
  function onFocusIn(e){
    const el = e.target;
    if (!el || !/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)) return;
    setTimeout(() => { try { el.scrollIntoView({ block:'center', behavior:'smooth' }); } catch(err){} }, 120);
  }
  function init(){
    setVH();
    window.addEventListener('resize', onViewportChange, { passive:true });
    window.addEventListener('orientationchange', onViewportChange);
    if (vv){ vv.addEventListener('resize', onViewportChange); vv.addEventListener('scroll', onViewportChange); }
    document.addEventListener('focusin', onFocusIn);
  }
  return { init };
})();

/* ============================================================
   BOOT
   ============================================================ */
function showFatal(msg){
  const splash = document.getElementById('splash');
  if (splash){
    splash.innerHTML = '<div style="padding:24px;text-align:center;color:#fff;font-family:system-ui"><div style="font-size:16px;font-weight:700;margin-bottom:12px">YOR WALLET</div><div style="font-size:13px;opacity:.7;max-width:320px;margin:0 auto;line-height:1.5">' + escapeHtml(msg) + '</div></div>';
  }
}

function boot(){
  if (boot._done) return; boot._done = true;
  ViewportEngine.init();

  /* Firebase must be configured before anything else. */
  if (!initFirebase()){
    showFatal('Firebase is not configured. Add your Firebase web config (public keys) inside FIREBASE_CONFIG in this file.');
    return;
  }

  /* Sidebar placeholder is empty until first user hydration. */
  renderSidebar();

  (function bindBottomNavOnce(){
    const nav = document.getElementById('bottom-nav');
    if (!nav || nav.__bound) return;
    nav.__bound = true;
    nav.querySelectorAll('[data-nav]').forEach(el => {
      el.addEventListener('click', (e) => {
        e.preventDefault();
        const n = el.getAttribute('data-nav');
        if (n === 'home') R.go('home');
        else if (n === 'history') R.go('history');
        else if (n === 'cards') R.go('cards');
        else if (n === 'profile') R.go('profile');
        else if (n === 'crypto') R.go('crypto');
      });
    });
  })();

  const splashLogo = document.getElementById('splash-logo');
  if (splashLogo) splashLogo.innerHTML = logoLockup(72);
  R.bind();
  UIKit.init();

  /* Subscribe to auth state. On ready we route the app. */
  let firstAuthEvent = true;
  AuthEngine.subscribe((signedIn) => {
    if (firstAuthEvent){
      firstAuthEvent = false;
      setTimeout(() => {
        const sp = document.getElementById('splash');
        if (sp){ sp.classList.add('is-hidden'); setTimeout(() => { sp.style.display = 'none'; }, 600); }
        LANG = (Runtime.settings && Runtime.settings.language) || 'en';
        applyI18n();
        applyTheme((Runtime.settings && Runtime.settings.theme) || 'dark');
        renderSidebar();
        if (signedIn) R.go('home', { reset:true, force:true });
        else R.go('login', { reset:true, force:true });
      }, 1500);
      return;
    }
    if (signedIn){
      LANG = (Runtime.settings && Runtime.settings.language) || 'en';
      applyI18n();
      applyTheme((Runtime.settings && Runtime.settings.theme) || 'dark');
      renderSidebar();
      R.go('home', { reset:true, force:true });
    } else {
      resetRuntime();
      renderSidebar();
      R.go('login', { reset:true, force:true });
    }
  });

  document.addEventListener('visibilitychange', () => {
    /* nothing persisted to localStorage other than device id */
  });

  document.addEventListener('click', function once(){ requestFullscreen(); document.removeEventListener('click', once); }, { once: true });

  window.YOR = {
    get context(){ return UserContext.get(); },
    get runtime(){ return Runtime; },
    version: CONFIG.APP.version
  };
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
</script>
