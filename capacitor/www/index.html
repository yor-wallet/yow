<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10052E">
<title>DOOM | دوم</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html { overflow-x: clip; }
  body {
    margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px;
    padding-top: max(24px, env(safe-area-inset-top)); padding-bottom: max(24px, env(safe-area-inset-bottom));
    background: radial-gradient(120% 80% at 50% 0%, #190B45 0%, #10052E 60%);
    color: #FFFFFF; font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Arabic", sans-serif; text-align: center;
  }
  main { max-width: 420px; width: 100%; }
  img { width: min(220px, 60vw); height: auto; display: block; margin: 0 auto 24px; }
  h1 { font-size: 1.25rem; margin: 0 0 8px; }
  p { color: #C9C5DE; margin: 0 0 4px; line-height: 1.6; }
  button {
    margin-top: 24px; min-height: 48px; padding: 0 28px; border: 0; border-radius: 999px; font-size: 16px; font-weight: 600;
    color: #10052E; background: linear-gradient(90deg, #087BFF, #00D9FF); cursor: pointer;
  }
  button:focus-visible { outline: 2px solid #FFAE00; outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <img src="logo.webp" width="512" height="512" alt="DOOM | دوم">
  <h1>لا يوجد اتصال بالإنترنت</h1>
  <p>No internet connection · Pas de connexion Internet</p>
  <button type="button" onclick="location.reload()">إعادة المحاولة · Retry · Réessayer</button>
</main>
</body>
</html>
